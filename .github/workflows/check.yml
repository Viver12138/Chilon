name: contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # All checks are stdlib-only; no pip install required.
      - name: Run design and registry checks
        run: python tools/check_all.py

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration dependencies
        # greenlet is required by SQLAlchemy's asyncio extension at import time.
        # PyPI occasionally stalls or fails on shared runners; retry, and emit an
        # annotation when it really fails so the cause is visible from the API.
        run: |
          for attempt in 1 2 3; do
            if pip install --disable-pip-version-check alembic "psycopg[binary]" greenlet; then
              echo "dependencies installed on attempt $attempt"
              exit 0
            fi
            echo "::warning::pip install attempt $attempt failed"
            sleep 5
          done
          echo "::error::pip install failed after 3 attempts"
          exit 1

      # 1) Apply the generated DDL directly and assert structure + constraints.
      - name: Apply generated DDL to PostgreSQL 17
        run: pwsh -NoProfile -File database/tests/run_container_test.ps1

      # 2) Run the Alembic baseline against a fresh database, verify, then roll
      #    back and assert nothing is left behind.
      - name: Apply baseline via Alembic and verify rollback
        run: pwsh -NoProfile -File database/tests/run_migration_test.ps1
      # 3) Prove row-level security actually isolates tenants.
      - name: Verify row-level security isolation
        run: pwsh -NoProfile -File database/tests/run_rls_test.ps1
      # 4) Outbox: atomicity, at-least-once retry, dead letter, idempotent consumer.
      - name: Verify outbox delivery contract
        run: pwsh -NoProfile -File database/tests/run_outbox_test.ps1
      # 5) Identity: hashing, session token handling, revocation, closed accounts.
      - name: Verify identity service
        run: pwsh -NoProfile -File database/tests/run_identity_test.ps1
      # 6) Task lifecycle: every contract transition, every illegal pair, CAS.
      - name: Verify task lifecycle against the contract
        run: pwsh -NoProfile -File database/tests/run_task_test.ps1
      # 7) Plan approval: single consumption, hash binding, expiry.
      - name: Verify plan approval contract
        run: pwsh -NoProfile -File database/tests/run_plan_test.ps1
      # 8) Execution: spends the approval once, fencing refuses stale workers.
      - name: Verify execution lifecycle and fencing
        run: pwsh -NoProfile -File database/tests/run_exec_test.ps1
      # 9) Step DAG: rejected at creation if unexecutable, scheduled by dependencies.
      - name: Verify plan step DAG
        run: pwsh -NoProfile -File database/tests/run_step_test.ps1
      # 10) Tools: capability/approval gates and idempotency across retries.
      - name: Verify tool invocation gates
        run: pwsh -NoProfile -File database/tests/run_tool_test.ps1
      # 11) Runs and unknown-outcome reconciliation (never retries a side effect).
      - name: Verify run mapping and reconciliation
        run: pwsh -NoProfile -File database/tests/run_run_test.ps1
